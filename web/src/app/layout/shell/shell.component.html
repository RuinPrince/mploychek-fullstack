<!-- Mobile overlay backdrop -->
<div
  class="sidebar-backdrop"
  *ngIf="isMobile && sidebarOpen"
  (click)="closeMobileSidebar()">
</div>

<div class="shell" [class.sidebar-collapsed]="!sidebarOpen">
  <!-- ─── SIDEBAR ─── -->
  <aside class="sidebar" [class.open]="sidebarOpen">
    <!-- Logo -->
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">
          <mat-icon>verified_user</mat-icon>
        </span>
        <span class="logo-text">MPloyChek</span>
      </div>
      <span class="logo-demo">Demo</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <a
        *ngFor="let item of visibleNavItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileSidebar()">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <!-- User card at bottom -->
    <div class="sidebar-footer" *ngIf="user">
      <div class="user-card">
        <div class="user-avatar">{{ userInitials }}</div>
        <div class="user-info">
          <span class="user-name">{{ user.name }}</span>
          <span class="user-role-chip">{{ user.role === 'ADMIN' ? 'Admin' : 'User' }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Sign out" aria-label="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  <!-- ─── MAIN CONTENT ─── -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <mat-icon>{{ sidebarOpen ? 'menu_open' : 'menu' }}</mat-icon>
        </button>
        <h1 class="page-title">{{ pageTitle }}</h1>
      </div>

      <div class="topbar-right">
        <!-- Delay control -->
        <div class="delay-control">
          <mat-icon class="delay-icon">timer</mat-icon>
          <span class="delay-label">API Delay</span>
          <select
            class="delay-select"
            [ngModel]="selectedDelay"
            (ngModelChange)="onDelayChange($event)">
            <option
              *ngFor="let opt of delayService.options"
              [ngValue]="opt.value">
              {{ opt.label }}
            </option>
          </select>
        </div>
      </div>
    </header>

    <!-- Content area -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

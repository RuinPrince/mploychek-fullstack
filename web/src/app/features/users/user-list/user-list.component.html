<app-page-header
  title="Users"
  subtitle="Manage platform users and access">
  <button mat-flat-button color="primary" (click)="openAddDialog()">
    <mat-icon>person_add</mat-icon>
    Add User
  </button>
</app-page-header>

<mat-card class="filter-card">
  <form [formGroup]="filterForm" class="filter-form">
    <!-- Search -->
    <mat-form-field appearance="outline" class="filter-field search-field">
      <mat-label>Search</mat-label>
      <input matInput formControlName="search" placeholder="Search by name, email, or ID">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <!-- Status -->
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option *ngFor="let s of statuses" [value]="s.value">{{ s.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-card>

<mat-card class="table-card">
  <app-async-view 
    [state]="(usersState$ | async)!" 
    (retry)="retry()"
    emptyIcon="people_outline"
    emptyTitle="No users found"
    emptyMessage="Try adjusting your search or filters to see more results.">
    
    <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="full-width">
        
        <!-- User ID -->
        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> <code class="mono-id">{{element.userId}}</code> </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element" class="bold-text"> {{element.name}} </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let element"> {{element.email}} </td>
        </ng-container>

        <!-- Role -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef> Role </th>
          <td mat-cell *matCellDef="let element"> 
            <span class="role-chip" [class.admin]="element.role === 'ADMIN'">
              {{element.role === 'ADMIN' ? 'Admin' : 'General User'}}
            </span>
          </td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element">
            <app-status-badge [status]="element.status"></app-status-badge>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
          <td mat-cell *matCellDef="let element" class="actions-cell">
            <button mat-icon-button color="primary" matTooltip="Edit user" (click)="openEditDialog(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <span [matTooltip]="element.userId === currentUserId ? 'You cannot deactivate yourself' : 'Deactivate user'">
              <button mat-icon-button color="warn" (click)="deactivateUser(element)" [disabled]="element.userId === currentUserId || element.status === 'INACTIVE'">
                <mat-icon>person_off</mat-icon>
              </button>
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['userId', 'name', 'email', 'role', 'status', 'actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['userId', 'name', 'email', 'role', 'status', 'actions'];"></tr>
      </table>
    </div>
  </app-async-view>
</mat-card>
